<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="towaleti">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>توالتی</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
    }

    #loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100dvh;
      color: #333;
      position: relative;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #loading.hidden {
      display: none;
    }

    #loading .loading-footer {
      position: absolute;
      bottom: 50px;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    #loading .loading-footer .loading-bar {
      width: 120px;
      height: 4px;
      background-color: rgba(151, 91, 255, 0.258);
      position: relative;
      overflow: hidden;
    }

    #loading .loading-footer .loading-bar::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #84D2F6;
      animation: loading-animation 1.5s linear infinite;
    }

    @keyframes loading-animation {
      0% {
        transform: translateX(100%);
      }

      50% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(-100%);
      }
    }

    #loading .loading-footer span {
      font-size: 12px;
      color: #333;
    }

    #loading img {
      width: 100px;
      height: 100px;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>
  <div id="loading">
    <img src="icons/Icon-192.png" alt="App Icon" />

    <div class="loading-footer">
      <div class="loading-bar"></div>
      <span>در حال بارگذاری اپ</span>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Hide loading after Flutter app is initialized
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      loading.classList.add('hidden');
    });
  </script>
</body>

</html>
